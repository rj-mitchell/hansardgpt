# Where They Stand on a single server: the app plus Caddy for automatic HTTPS.
# Usage (from this directory): cp .env.example .env && edit, then
#   docker compose up -d --build
services:
  app:
    build:
      context: ..
    env_file: .env
    volumes:
      - hansard-data:/data
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:?set REDIRECT_DOMAINS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  hansard-data:
  caddy-data:
  caddy-config:
